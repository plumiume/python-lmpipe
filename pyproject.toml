[project]
name = "lmpipe"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "ikeda", email = "ikeda@lee-lab.org" }
]
requires-python = ">=3.12"
dependencies = [
    "absl-py>=2.3.1",
    "clipar",
    "loky>=3.5.6",
    "mediapipe>=0.10.14",
    "opencv-python>=4.12.0.88",
    "parse>=1.20.2",
    "pip>=25.2",
    "requests>=2.32.4",
    "rich>=14.2.0",
]

[project.scripts]
lmpipe = "lmpipe.app.cli.__main__:main"

[project.entry-points."lmpipe.plugins"]
"mediapipe.pose" = "lmpipe.plugins.mediapipe:pose_entry"
"mediapipe.left_hand" = "lmpipe.plugins.mediapipe:left_hand_entry"
"mediapipe.right_hand" = "lmpipe.plugins.mediapipe:right_hand_entry"
"mediapipe.face" = "lmpipe.plugins.mediapipe:face_entry"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
# Primary: dev branch (for development)
clipar = { git = "https://github.com/plumiume/python-clipar.git", branch = "dev/latest" }
# Fallback: main branch (uncomment if dev branch fails)
# clipar = { git = "https://github.com/plumiume/python-clipar.git", branch = "main" }

[dependency-groups]
dev = [
    "colorama>=0.4.6",
    "ipykernel>=6.30.1",
    "ipython>=9.6.0",
    "loky>=3.5.6",
    "sphinx>=8.2.3",
    "sphinx-autodoc-typehints>=3.5.2",
    "sphinx-wagtail-theme>=6.5.0",
    "types-html5lib>=1.1.11.20250917",
    "types-requests>=2.32.4.20250913",
]
