[project]
name = "lmpipe"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "plumiume", email = "plumiume@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "clipar",
    "cloudpickle>=3.1.1",
    "mediapipe>=0.10.14",
    "opencv-python>=4.12.0.88",
    "parse>=1.20.2",
    "requests>=2.32.4",
]

[project.scripts]
lmpipe = "lmpipe.app.cli.__main__:main"

[project.entry-points."lmpipe.plugins"]
"mediapipe.pose" = "lmpipe.plugins.mediapipe:pose_entry"
"mediapipe.hand" = "lmpipe.plugins.mediapipe:hand_entry"
"mediapipe.face" = "lmpipe.plugins.mediapipe:face_entry"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
clipar = { git = "https://github.com/plumiume/python-clipar.git" }

[dependency-groups]
dev = [
    "ipykernel[colorama]>=6.30.1",
    "ipython>=9.5.0",
    "loky>=3.5.6",
]
